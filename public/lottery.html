<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f12">
    <title>映像間｜膠捲抽選</title>
    <link rel="stylesheet" href="/lottery.css?v=19">
    <script type="importmap">
        { "imports": { "three": "/vendor/three/three.module.min.js" } }
    </script>
</head>
<body>
    <audio id="lobbyMusic" src="/sounds/大廳.mp3?v=1" preload="auto" autoplay loop aria-hidden="true"></audio>
    <audio id="tvStaticNoise" src="/sounds/tv-static-noise.mp3" preload="auto" aria-hidden="true"></audio>
    <main class="lottery-page">
        <section class="film-shell">
            <div class="film-stage" id="filmStage" tabindex="0" aria-label="動態影片膠捲，點選盒子開始抽獎">
                <div class="film-video-sources" aria-hidden="true">
                    <video
                        class="film-video-source"
                        data-film-video="cyc"
                        src="/example-images/CYC.mp4"
                        preload="auto"
                        autoplay
                        loop
                        muted
                        playsinline
                    ></video>
                    <video
                        class="film-video-source"
                        data-film-video="poison"
                        src="/example-images/毒藥.mp4"
                        preload="auto"
                        autoplay
                        loop
                        muted
                        playsinline
                    ></video>
                </div>
                <div class="stage-loading" role="status" aria-label="載入影片影格"></div>
            </div>
        </section>
    </main>

    <script type="module" src="/lottery.js?v=45"></script>
</body>
</html>
