<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>映像間｜歌仔戲抽獎</title>
    <link rel="stylesheet" href="/opera.css?v=2">
    <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js" } }</script>
</head>
<body>
    <main id="operaStage" tabindex="0" aria-label="歌仔戲環形抽獎展台。左右滑動、滾輪或方向鍵切換道具，點選道具或按 Enter 抽獎。">
        <div id="propControls" class="prop-controls" role="group" aria-label="抽獎道具"></div>
        <p id="operaStatus" class="sr-only" role="status" aria-live="polite"></p>
        <div id="stageFeedback" class="stage-feedback" aria-hidden="true" hidden></div>
        <button id="refreshPool" class="icon-button refresh-pool" type="button" aria-label="重新讀取抽獎名單" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.1 6.5M20 4v7h-7"/></svg>
        </button>
    </main>
    <section id="winnerPanel" class="winner-panel" role="dialog" aria-modal="true" aria-labelledby="winnerName" hidden>
        <div class="winner-art"><img id="winnerImage" alt="" hidden><video id="winnerVideo" playsinline preload="none" disablepictureinpicture hidden></video></div>
        <h1 id="winnerName"></h1>
        <button id="closeWinner" class="icon-button close-winner" type="button" aria-label="返回抽獎舞台"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        <button id="playWinner" class="icon-button play-winner" type="button" aria-label="播放中獎影片" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg></button>
        <button id="retryMedia" class="icon-button play-winner" type="button" aria-label="重新載入中獎照片" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.1 6.5M20 4v7h-7"/></svg></button>
        <p id="mediaStatus" class="sr-only" role="status" aria-live="polite"></p>
    </section>
    <script type="module" src="/opera.js?v=3"></script>
</body>
</html>
